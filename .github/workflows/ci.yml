name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  DEVELOPER_DIR: /Applications/Xcode_16.0.app/Contents/Developer
  SWIFT_VERSION: 6.0

jobs:
  lint-and-format:
    name: Lint & Format
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftFormat
        run: brew install swiftformat
      - name: Check formatting
        run: swiftformat --lint --verbose .
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        run: swiftlint lint --strict

  test-macos:
    name: Test on macOS
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      matrix:
        xcode: ['16.0', '16.1']
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Run tests
        run: swift test --parallel
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.xcode }}
          path: .build/debug/*.xctestrun
          retention-days: 7

  test-ios-simulator:
    name: Test on iOS Simulator
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run iOS tests
        run: |
          xcodebuild test \
            -scheme PagedAttentionMetal \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.0' \
            -enableCodeCoverage YES \
            -quiet

  build-release:
    name: Build Release
    runs-on: macos-latest
    timeout-minutes: 20
    needs: [test-macos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build release
        run: swift build -c release --static-swift-stdlib
      - name: Create artifacts
        run: |
          mkdir -p artifacts
          cp -r .build/release/PagedAttentionServer artifacts/
          cp -r .build/release/MinimalLLM artifacts/
          cp -r .build/release/Profiler artifacts/
          tar -czf artifacts/pagedattention-macos-${{ github.sha }}.tar.gz -C artifacts .
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: artifacts/
          retention-days: 30

  docc-documentation:
    name: Build Documentation
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build DocC
        run: |
          swift package \
            --allow-writing-to-directory ./docs \
            generate-documentation \
            --target PagedAttentionMetal \
            --output-path ./docs \
            --transform-for-static-hosting \
            --hosting-base-path pagedattentionmetal
      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/
          retention-days: 30
      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs

  security-scan:
    name: Security Scan
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run Swift Package Security Audit
        run: |
          swift package audit
        continue-on-error: true
      - name: Check for secrets
        run: |
          brew install gitleaks
          gitleaks detect --source . --verbose

  benchmarks:
    name: Run Benchmarks
    runs-on: macos-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build benchmarks
        run: swift build -c release
      - name: Run benchmarks
        run: |
          swift run -c release Benchmarks all --output benchmarks.json
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks.json
          retention-days: 30
      - name: Compare with baseline
        run: |
          if [ -f baseline.json ]; then
            python3 scripts/compare_benchmarks.py baseline.json benchmarks.json
          else
            echo "No baseline found, saving current as baseline"
            cp benchmarks.json baseline.json
          fi

  deploy-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            abderahmane/pagedattentionmetal:latest
            abderahmane/pagedattentionmetal:${{ github.sha }}
          platforms: linux/arm64

  release:
    name: Create Release
    runs-on: macos-latest
    timeout-minutes: 15
    needs: [build-release, docc-documentation]
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: artifacts/
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/PagedAttentionServer
            artifacts/MinimalLLM
            artifacts/Profiler
          generate_release_notes: true