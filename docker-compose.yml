version: '3.8'

services:
  pagedattention:
    build:
      context: .
      dockerfile: Dockerfile
    image: pagedattentionmetal:latest
    container_name: pagedattention-server
    ports:
      - "8080:8080"
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - MAX_BATCH_SIZE=16
      - MAX_SEQUENCES=128
      - MAX_BLOCKS=2048
      - BLOCK_SIZE=16
      - LOG_LEVEL=info
      - RUST_LOG=info
    volumes:
      - ./models:/app/models:ro
      - ./logs:/app/logs
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G

  # Optional: Prometheus metrics exporter
  prometheus:
    image: prom/prometheus:latest
    container_name: pagedattention-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: pagedattention-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=changeme
    volumes:
      - ./config/grafana:/etc/grafana/provisioning:ro
    restart: unless-stopped

networks:
  default:
    name: pagedattention-network